name: bifrost-modular-test

services:
  redis:
    image: redis:7-alpine

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bifrost
      MYSQL_USER: bifrost
      MYSQL_PASSWORD: bifrost
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bifrost
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: bifrost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost"]
      interval: 5s
      timeout: 5s
      retries: 20

  tests:
    build:
      context: ../..
      dockerfile: docker/modular/Dockerfile.test
    environment:
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
