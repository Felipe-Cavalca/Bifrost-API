name: API Quality On PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  api-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2
          coverage: none
          extensions: curl, json, mongodb, pdo_sqlite

      - name: Install dependencies
        id: install_dependencies
        run: composer install --working-dir=api --no-interaction --no-progress --prefer-dist

      - name: Validate Composer
        id: composer_validate
        if: always() && steps.install_dependencies.outcome == 'success'
        run: composer quality:composer
        working-directory: api

      - name: Check formatting
        id: format_check
        if: always() && steps.install_dependencies.outcome == 'success'
        run: composer format:check
        working-directory: api

      - name: Run PHP lint
        id: php_lint
        if: always() && steps.install_dependencies.outcome == 'success'
        run: composer lint
        working-directory: api

      - name: Run PHPStan
        id: phpstan
        if: always() && steps.install_dependencies.outcome == 'success'
        run: composer analyse
        working-directory: api

      - name: Run PHPUnit
        id: phpunit
        if: always() && steps.install_dependencies.outcome == 'success'
        run: composer test
        working-directory: api

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## API quality"
            echo ""
            echo "- Composer install: ${{ steps.install_dependencies.outcome }}"
            echo "- Composer validate: ${{ steps.composer_validate.outcome }}"
            echo "- Format check: ${{ steps.format_check.outcome }}"
            echo "- PHP lint: ${{ steps.php_lint.outcome }}"
            echo "- PHPStan: ${{ steps.phpstan.outcome }}"
            echo "- PHPUnit: ${{ steps.phpunit.outcome }}"
            echo "- Workflow: \`${{ github.workflow }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with consolidated result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- bifrost-api-quality -->';
            const checks = [
              { name: 'Composer install', command: 'composer install --working-dir=api', outcome: '${{ steps.install_dependencies.outcome }}' },
              { name: 'Composer validate', command: 'composer quality:composer', outcome: '${{ steps.composer_validate.outcome }}' },
              { name: 'Format check', command: 'composer format:check', outcome: '${{ steps.format_check.outcome }}' },
              { name: 'PHP lint', command: 'composer lint', outcome: '${{ steps.php_lint.outcome }}' },
              { name: 'PHPStan', command: 'composer analyse', outcome: '${{ steps.phpstan.outcome }}' },
              { name: 'PHPUnit', command: 'composer test', outcome: '${{ steps.phpunit.outcome }}' },
            ];

            const failed = checks.filter(check => check.outcome !== 'success' && check.outcome !== 'skipped');
            const passed = failed.length === 0;
            const body = passed
              ? [
                  marker,
                  '## API quality',
                  '',
                  'Status: **passed**',
                  '',
                  'Todos os checks do framework passaram.',
                  '',
                  `Workflow: \`${context.workflow}\``,
                  `Commit: \`${context.sha}\``,
                ].join('\n')
              : [
                  marker,
                  '## API quality',
                  '',
                  'Status: **failed**',
                  '',
                  'Checks com problema:',
                  ...failed.map(check => `- ${check.name}: **${check.outcome}** (\`${check.command}\`)`),
                  '',
                  'Consulte os logs do workflow para o detalhe completo da falha.',
                  '',
                  `Workflow: \`${context.workflow}\``,
                  `Commit: \`${context.sha}\``,
                ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const previous = comments.find(comment => comment.body && comment.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
