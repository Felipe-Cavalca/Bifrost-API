name: Modular Packages Quality

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'skeleton/**'
      - 'docs/**'
      - '.devcontainer/check.sh'
      - '.github/workflows/modular-packages.yml'

jobs:
  framework-check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bifrost
          MYSQL_USER: bifrost
          MYSQL_PASSWORD: bifrost
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bifrost
          POSTGRES_USER: bifrost
          POSTGRES_PASSWORD: bifrost
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bifrost -d bifrost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2
          coverage: none
          extensions: json, redis, apcu, mongodb, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite

      - name: Validar monorepo Composer
        env:
          REDIS_HOST: 127.0.0.1
          MYSQL_HOST: 127.0.0.1
          POSTGRES_HOST: 127.0.0.1
        run: sh .devcontainer/check.sh
