services:
  api:
    # Instala PDO MySQL e aponta a aplicacao para o servico abaixo.
    build:
      args:
        INSTALL_MYSQL: 1
    environment:
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: app
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    # Credenciais locais de desenvolvimento. Use secrets fora deste ambiente.
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 5s
      timeout: 3s
      retries: 20
