; Modos ativos (sem debug para não travar requisições por falta de listener)
xdebug.mode=develop,profile,trace
; Inicia profiler/trace em toda requisição (sem precisar de trigger)
xdebug.start_with_request=yes
xdebug.use_compression=0

; Conexão com o VS Code (host da máquina)
xdebug.client_host=host.docker.internal
xdebug.client_port=9003

; Logs
xdebug.log=/var/log/xdebug.log
xdebug.log_level=7

; Saída de profiler/trace (mapeada para o host)
xdebug.output_dir=/var/www/html/tmp/xdebug
xdebug.profiler_output_name=cachegrind.out.%t
xdebug.trace_output_name=trace.%c
xdebug.trace_format=1
