; Xdebug para desenvolvimento: habilita desenvolvimento, trace e profiler via trigger
xdebug.mode=develop,profile,trace
; Ativa somente quando XDEBUG_TRIGGER estiver setado (evita travar requisicoes)
xdebug.start_with_request=trigger
xdebug.use_compression=0

; Conexao com o VS Code (host da maquina)
xdebug.client_host=host.docker.internal
xdebug.client_port=9003

; Logs
xdebug.log=/var/log/xdebug/xdebug.log
xdebug.log_level=7

; Saida de profiler/trace (mapeada para o host)
xdebug.output_dir=/var/www/html/tmp/xdebug
xdebug.profiler_output_name=cachegrind.out.%t
xdebug.trace_output_name=trace.%c
xdebug.trace_format=1
